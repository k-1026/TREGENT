<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도달쑤 × 대구</title>
<style>
  :root {
    --bg: #fffaf0; --card: #ffffff; --ink: #2b2420; --muted: #7a6d63;
    --accent: #f9c23c; --accent-ink: #3a2a00; --line: #eadfcd; --ok: #2f8f4e; --warn: #c0662b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .frame { aspect-ratio: 1145 / 1374; display: grid; place-items: center; background: #fdf6e7;
    border-radius: 12px; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: contain; }
  textarea { width: 100%; min-height: 96px; padding: 12px; font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px;
    font: inherit; font-size: 14px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  button.go { width: 100%; padding: 14px; font: inherit; font-size: 17px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: wait; }
  .status { min-height: 24px; margin: 12px 0 0; color: var(--muted); }
  .meta { margin-top: 12px; font-size: 14px; line-height: 1.6; }
  .meta .ok { color: var(--ok); } .meta .warn { color: var(--warn); }
  .placeholder { color: var(--muted); padding: 24px; text-align: center; }
  a.dl { display: inline-block; margin-top: 8px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>도달쑤 × 대구</h1>
  <p class="sub">대구 관광지와 장면을 적으면, 원형 도달쑤가 그곳을 즐기는 그림을 만들어요. 관광지를 안 적으면 서문시장으로 그려요.</p>

  <div class="card">
    <textarea id="text" placeholder="예) 수성못에서 오리배 타며 아이스크림 먹는 도달쑤"></textarea>
    <div class="chips">
      <button class="chip">서문시장 야시장에서 씨앗호떡 먹는 도달쑤</button>
      <button class="chip">김광석다시그리기길에서 통기타 치는 도달쑤</button>
      <button class="chip">수성못에서 오리배 구경하는 도달쑤</button>
      <button class="chip">근대골목 계산성당 앞에서 사진 찍는 도달쑤</button>
      <button class="chip">이월드에서 솜사탕 든 도달쑤</button>
      <button class="chip">팔공산 단풍 등산하는 도달쑤</button>
    </div>
    <button class="go" id="go">그림 만들기</button>
    <p class="status" id="status"></p>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card">
      <h2>원형 (고정)</h2>
      <div class="frame"><img src="/base.png" alt="원형 도달쑤"></div>
    </div>
    <div class="card">
      <h2>결과</h2>
      <div class="frame" id="result"><div class="placeholder">아직 만든 그림이 없어요.</div></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  function downloadPng(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || 1145; canvas.height = img.naturalHeight || 1374;
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = img.src.split('/').pop().replace('.svg', '.png');
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  }
  document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { $('text').value = c.textContent; }));

  $('go').addEventListener('click', async () => {
    const text = $('text').value.trim();
    if (!text) { $('status').textContent = '그리고 싶은 장면을 적어 주세요.'; return; }
    $('go').disabled = true;
    $('status').textContent = '관광지 배경과 소품을 그리는 중이에요. 30초~1분 걸릴 수 있어요.';
    $('meta').innerHTML = '';
    try {
      const res = await fetch('/api/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '알 수 없는 오류');
      $('result').innerHTML = '';
      const img = new Image(); img.src = data.image_url; img.alt = data.scene_ko;
      $('result').appendChild(img);
      const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
      $('meta').innerHTML = `
        <div><b>장면</b> ${esc(data.scene_ko)}</div>
        <div><b>관광지</b> ${esc(data.spot || '-')}${data.spot_known ? '' : ' <span class="warn">(사전에 없는 곳이라 실제 모습과 다를 수 있어요)</span>'}${data.spot_drawn ? ' <span class="warn">(준비된 배경이 없어 Gemini가 그린 배경)</span>' : ''}</div>
        <div><b>포즈</b> ${esc(data.pose)}</div>
        <div><b>소품</b> ${esc(data.elements.join(', ') || '-')}</div>
        ${data.missing.length ? `<div class="warn"><b>준비된 소품이 없어 못 넣은 것</b> ${esc(data.missing.join(', '))}</div>` : ''}
        ${data.removed.length ? `<div><b>뺀 요소</b> ${esc(data.removed.join(', '))}</div>` : ''}
        <div class="ok"><b>원형</b> 얼굴·몸은 원형 그대로, 포즈에 따라 팔만 바뀜</div>
        <a class="dl" href="#" id="dl-png">PNG로 내려받기</a> · <a class="dl" href="${data.image_url}" download>SVG로 내려받기</a>`;
      $('dl-png').addEventListener('click', (ev) => { ev.preventDefault(); downloadPng(img); });
      $('status').textContent = '';
    } catch (e) {
      $('status').textContent = '실패: ' + e.message;
    } finally {
      $('go').disabled = false;
    }
  });
</script>
</body>
</html>
